<!DOCTYPE html>
<html>
  <head>
    <title>My Test Website</title>
    <style>
      body {
        font-family: Arial;
        background: #111;
        color: white;
        padding: 20px;
      }
      input {
        display: block;
        margin: 10px 0;
        padding: 8px;
        width: 200px;
      }
      button {
        padding: 10px 20px;
        background: #4CAF50;
        border: none;
        color: white;
        cursor: pointer;
      }
      #admin {
        margin-top: 20px;
        padding: 20px;
        background: #222;
        border: 1px solid #444;
        display: none;
      }
    </style>
  </head>

  <body>
    <h1>Welcome to My Test Website</h1>
    <p>This site is for SAFE hacking practice only.</p>

    <h2>Login</h2>
    <form onsubmit="return checkLogin(event)">
      <input id="user" type="text" placeholder="Username">
      <input id="pass" type="password" placeholder="Password">
      <button>Login</button>
    </form>

    <p id="result"></p>

    <div id="admin">
      <h2>Admin Panel</h2>
      <p>Secret admin data: 12345</p>
    </div>

    <script>
      function checkLogin(event) {
        event.preventDefault();

        const u = document.getElementById("user").value;
        const p = document.getElementById("pass").value;

        // INTENTIONALLY WEAK LOGIN (for learning)
        if (u === "admin" && p === "1234") {
          document.getElementById("result").innerText = "Logged in!";
          document.getElementById("admin").style.display = "block";
        } else {
          document.getElementById("result").innerText = "Wrong username or password.";
        }
      }
    </script>
  </body>
</html>
